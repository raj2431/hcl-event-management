<div class="space-y-6">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <p class="text-sm font-medium text-brand-500">Team overview</p>
      <h1 class="mt-1 text-2xl font-semibold text-gray-900 dark:text-white">App users</h1>
    </div>

    <!-- <button
      type="button"
      class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600"
    >
      Add user
    </button> -->
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-800">
        <thead class="bg-gray-50 dark:bg-gray-900/60">
          <tr>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.12em] text-gray-500 dark:text-gray-400">User</th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.12em] text-gray-500 dark:text-gray-400">Role</th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.12em] text-gray-500 dark:text-gray-400">Team</th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.12em] text-gray-500 dark:text-gray-400">Status</th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.12em] text-gray-500 dark:text-gray-400">Account access</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 bg-white dark:divide-gray-800 dark:bg-transparent">
          @for (user of users; track user.id) {
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-900/40">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold text-brand-700 dark:bg-brand-500/10 dark:text-brand-300">
                    {{ user.name.charAt(0) }}
                  </div>
                  <div>
                    <p class="font-medium text-gray-900 dark:text-white">{{ user.name }}</p>
                    <p class="text-sm text-gray-500 dark:text-gray-400">{{ user.email }}</p>
                  </div>
                </div>
              </td>

              <td class="px-6 py-4 text-sm text-gray-700 dark:text-gray-200">{{ user.role }}</td>
              <td class="px-6 py-4 text-sm text-gray-700 dark:text-gray-200">{{ user.team }}</td>

              <td class="px-6 py-4">
                <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium" [ngClass]="getStatusClasses(user.status)">
                  {{ user.status }}
                </span>
              </td>

              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <button
                    type="button"
                    role="switch"
                    [attr.aria-checked]="user.enabled"
                    [attr.aria-label]="(user.enabled ? 'Disable ' : 'Enable ') + user.name"
                    (click)="toggleUser(user)"
                    class="inline-flex h-6 w-11 shrink-0 items-center rounded-full p-0.5 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-gray-900"
                    [ngClass]="user.enabled ? 'bg-success-500' : 'bg-gray-300 dark:bg-gray-700'"
                  >
                    <span
                      class="h-5 w-5 rounded-full bg-white shadow transition-transform"
                      [ngClass]="user.enabled ? 'translate-x-5 rtl:-translate-x-5' : 'translate-x-0'"
                    ></span>
                  </button>
                  <span class="text-sm text-gray-600 dark:text-gray-300">{{ user.enabled ? 'Enabled' : 'Disabled' }}</span>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
